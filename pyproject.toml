[project]
name = "new-commons"
version = "0.1.0"
description = "The New Commons: provider-neutral collaboration infrastructure for personal AI assistants"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["commons"]

[tool.setuptools.package-data]
commons = ["migrations/*.sql", "web/*"]
