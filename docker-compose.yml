# Local deployment: one container, one SQLite file in ./data. No paid services.
services:
  commons:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Optional: a free Cloudflare quick tunnel to give ChatGPT/Claude a public HTTPS URL.
  # Start with:  docker compose --profile tunnel up
  # Then copy the https://*.trycloudflare.com URL from the logs into COMMONS_PUBLIC_URL and restart commons.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://commons:8000
    depends_on: [commons]
